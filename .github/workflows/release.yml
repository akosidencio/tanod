name: Release

on:
  push:
    tags: ["v*"]
  # Lets you re-cut an image from a tag without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag is cut by hand, and the two mistakes a human makes cutting one both
  # fail late and expensively. The v0.1.3 release is the worked example: the
  # bump commit edited `version` in Cargo.toml and never regenerated
  # Cargo.lock, so every `--locked` cargo call in the suite below died with
  # "cannot update the lock file" — 30 seconds into a job, 12 minutes into a
  # release, and with an error message that says nothing about the version
  # bump that caused it.
  #
  # Both checks are cheap and neither needs the project to compile, so they run
  # ahead of everything and gate it. A mis-cut tag now costs seconds.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships a mislabelled release.
      - name: Verify the tag matches Cargo.toml
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "v$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate"
            exit 1
          fi

      # `cargo metadata` resolves the full graph against the lockfile, so
      # --locked fails here for exactly the reasons it fails in a build: a
      # version bump, an added dependency, or an edited constraint that never
      # made it into Cargo.lock.
      - name: Verify Cargo.lock is in sync with Cargo.toml
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error::Cargo.lock is stale — run 'cargo check' and commit the regenerated Cargo.lock"
            exit 1
          fi

  # A tag can point at any commit, and CI only runs on branches — so re-run the
  # full QA suite against the tagged tree before anything is published. The ref
  # is passed explicitly: a `workflow_dispatch` re-cut would otherwise test the
  # branch it was started from while the artifacts below are built from the tag.
  test:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  # The versioned release binary — Linux only, deliberately.
  #
  # Tanod is deployed on Linux and the published image is `linux/amd64`, so
  # this exists for the one documented topology a container does not serve: the
  # systemd unit in docs/OPERATIONS.md, which runs `/usr/local/bin/tanod`
  # directly. A macOS build would be an artifact for a platform nothing is
  # deployed on, and one the reproducibility claim never covered anyway.
  #
  # Built from the tagged tree with the toolchain pinned in rust-toolchain.toml
  # and `--locked`, which together are what make it reproducible from a clean
  # checkout. scripts/reproducible-build.sh derives and remaps the checkout and
  # Cargo-cache paths, so a local checkout in a different directory can produce
  # the same bytes as CI.
  binaries:
    name: binary (x86_64-unknown-linux-gnu)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-gnu
      FEATURES: tls
    # Published so `publish` can ask for this artifact by exact name rather
    # than downloading whatever else the run happens to contain.
    outputs:
      artifact: ${{ steps.package.outputs.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: |
          ./scripts/reproducible-build.sh \
            --target ${{ env.TARGET }} \
            --features "${{ env.FEATURES }}"

      # It has to actually run. A binary that builds and then dies on a missing
      # shared library is a release nobody can use, discovered by users.
      - name: Smoke test
        run: |
          bin="target/${{ env.TARGET }}/release/tanod"
          "$bin" version
          "$bin" check --config tanod.yaml

      - name: Package
        id: package
        shell: bash
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="tanod-${version}-${{ env.TARGET }}"
          mkdir -p "dist/$name/docs"
          cp "target/${{ env.TARGET }}/release/tanod" "dist/$name/"
          cp packaging/systemd/tanod.service "dist/$name/"
          cp packaging/install.sh "dist/$name/"
          chmod 0755 "dist/$name/install.sh"
          cp docs/STANDALONE.md "dist/$name/docs/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # The checksum of the *binary* as well as of the archive: gzip records
          # a modification time, so an archive is not byte-reproducible while
          # the binary inside it is. Verifying a rebuild means comparing the
          # inner one; this is what makes that possible.
          ( cd "dist/$name" && shasum -a 256 tanod > "../$name.binary.sha256" )
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # A CycloneDX SBOM of the resolved dependency tree.
  #
  # Resolved, not linked: the lockfile contains crates belonging to optional
  # features and other platforms that are never compiled into a given artifact.
  # It over-reports rather than under-reports, which is the safe direction, and
  # must not be read as an exact inventory of what runs.
  sbom:
    name: sbom
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # --all-features so the SBOM covers the TLS build too, which is what
          # the published binary and the image are compiled with.
          cargo cyclonedx --format json --all-features --spec-version 1.5
          find . -name '*.cdx.json' -not -path './target/*' -print
          mkdir -p dist
          cp tanod.cdx.json "dist/tanod-${version}.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  image:
    name: build + push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=tanod
            org.opencontainers.image.description=Origin workload governor for server-rendered applications
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # The published image includes TLS. Unlike a source build, nobody can
          # recompile a container to turn a feature on, so shipping without it
          # would make `server.tls` unusable for every image user — and the
          # config would be *rejected* at startup rather than silently ignored,
          # which is correct but a poor first experience.
          build-args: |
            FEATURES=tls
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test the pushed image
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          docker run --rm "$image" version
          docker run --rm -v "$PWD/tanod.yaml:/etc/tanod/tanod.yaml:ro" \
            "$image" check --config /etc/tanod/tanod.yaml

      - name: Summarise
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Attach everything to the GitHub release, with one SHA256SUMS covering every
  # archive.
  publish:
    name: publish release artifacts
    needs: [binaries, sbom, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # By exact name, both of them. Downloading the whole run instead pulls in
      # artifacts this job has no use for: `benchmark-results` from the CI
      # workflow above, and the `.dockerbuild` build record that
      # docker/build-push-action uploads on its own. The build record is the
      # one that failed to extract after five retries and took the release
      # down with it — a record of how the image was built has no place in a
      # step whose job is to attach archives to a tag.
      - name: Download the release binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binaries.outputs.artifact }}
          path: staging/binary

      - name: Download the SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: staging/sbom

      - name: Collect and checksum
        id: collect
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist
          find staging -name '*.tar.gz' -exec cp {} dist/ \;
          find staging -name '*.cdx.json' -exec cp {} dist/ \;
          find staging -name '*.binary.sha256' -exec cp {} dist/ \;
          ( cd dist && sha256sum ./*.tar.gz ./*.cdx.json | sed 's| \./| |' > SHA256SUMS )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la dist
          cat dist/SHA256SUMS

      # A release with no archives in it is a green build and a broken
      # download page, and nothing else in this workflow would have noticed.
      - name: Refuse to publish an empty release
        run: |
          count=$(find dist -name '*.tar.gz' | wc -l)
          echo "archives: $count"
          [ "$count" -ge 1 ] || { echo "::error::no archives to publish"; exit 1; }
          [ -s dist/SHA256SUMS ] || { echo "::error::SHA256SUMS is empty"; exit 1; }

      - name: Upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            ## Verifying this release

            ```bash
            sha256sum --ignore-missing -c SHA256SUMS
            ```

            The container image carries build provenance and its own SBOM as
            attestations:

            ```bash
            gh attestation verify \
              "oci://ghcr.io/${{ github.repository }}:${{ steps.collect.outputs.version }}" \
              --repo ${{ github.repository }}
            ```

            `tanod-${{ steps.collect.outputs.version }}.cdx.json` is a
            CycloneDX SBOM of the resolved Rust dependency tree. It lists what
            Cargo resolved, which is a superset of what is linked into any one
            artifact.

            A Linux binary reproduces from a clean checkout of this tag with
            [scripts/reproducible-build.sh](https://github.com/${{ github.repository }}/blob/${{ inputs.tag || github.ref_name }}/scripts/reproducible-build.sh).
            The `.tar.gz` archive is not: gzip stores a modification time, so
            compare the checksum of the binary inside it. The image digest is
            not reproducible either — verify the image through its provenance
            attestation instead.
