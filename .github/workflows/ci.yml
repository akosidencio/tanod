name: CI

on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
    branches: [main, dev, 'feat/**']
  # Reused as the release gate so a tag cannot publish untested code.
  workflow_call:
    inputs:
      ref:
        # Without this every job below checks out `github.ref`, which is the
        # *caller's* ref. On a tag push that is the tag, so the gate is honest.
        # On a `workflow_dispatch` re-cut it is the branch the run was started
        # from — so the QA suite would pass on `main` while the binary, SBOM
        # and image were built from the tag. Release passes the tag explicitly.
        description: "Ref to check out. Defaults to the caller's ref."
        type: string
        required: false
        default: ""

# A new push to a branch cancels the run still going for the old head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Linux is the only platform, not merely the reference one: Tanod is
  # deployed on Linux, the published image is `linux/amd64`, and the release
  # binary targets `x86_64-unknown-linux-gnu`. Every job here runs the full
  # gate, including the end-to-end benchmarks and the containerised Next.js
  # proof.
  test:
    name: fmt + clippy + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # pingora builds its TLS bindings from source.
      - name: Install build dependencies
        run: |
          # The hosted image adds Chrome's apt source, which these jobs do not
          # use and which can transiently publish mismatched index metadata.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      # An optional feature that is never compiled in CI rots. This also covers
      # the validation rules that branch on `cfg!(feature = "tls")`, which have
      # opposite expected outcomes in the two builds.
      - name: Clippy and test with TLS
        run: |
          cargo clippy --workspace --all-targets --locked --features tls -- -D warnings
          cargo test --workspace --lib --locked --features tls

      # --all-targets silently skips doc tests, so run them separately.
      - name: Doc tests
        run: cargo test --workspace --doc --locked

      # The operator artifacts are shipped for people to import, so they have
      # to at least parse. A dashboard that fails to import, or a rules file
      # Prometheus refuses to load, is discovered by whoever needed it during
      # an incident otherwise.
      - name: Check the operator artifacts
        run: |
          python3 -c "import json; json.load(open('ops/grafana/dashboard.json'))"
          python3 -c "import yaml; yaml.safe_load(open('ops/prometheus/alerts.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('ops/prometheus/recording-rules.yml'))"
          curl -fsSL -o /tmp/prom.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          /tmp/prometheus-2.53.2.linux-amd64/promtool check rules \
            ops/prometheus/alerts.yml ops/prometheus/recording-rules.yml

  # A dependency advisory is a finding about code this binary runs at full
  # privilege, so it gates like any other. Ignores live in `.cargo/audit.toml`
  # and each one carries a reason and a way out.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit -D warnings

  # The static musl binary and `tanod-next start`, together, in an Alpine
  # Node image: the deployment @tanod/linux-x64 exists for. Built here as well
  # as at release so a change that breaks the static build fails on the pull
  # request, not on the tag.
  static:
    name: static binary + tanod-next start (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build the static binary
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          docker run --rm -v "$PWD":/src -w /src "rust:${toolchain}-alpine" sh -euc '
            apk add --no-cache musl-dev cmake clang perl make linux-headers >/dev/null
            cargo build --release --locked --bin tanod --features tls --target x86_64-unknown-linux-musl
          '
      - name: Run tanod-next start with it in node:22-alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src node:22-alpine \
            sh scripts/start-smoke.sh target/x86_64-unknown-linux-musl/release/tanod

  # @tanod/next, on both runtimes it claims to support.
  #
  # The Rust binary is built first on purpose: the package's headline claim is
  # that what it generates is a configuration Tanod accepts, and the test
  # that proves it skips itself when the binary is absent. Skipping quietly in
  # CI would leave the one assertion that matters unenforced.
  tanod-next:
    name: "@tanod/next (node + bun)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/tanod-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tanod, so the generated config can be checked for real
        run: cargo build
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dev dependencies (typescript, @types/node)
        run: npm install --no-save typescript@^5.6 @types/node@^22
      - name: Typecheck
        run: npm run typecheck
      - name: Test on Node
        run: npm test
        env:
          # A `cargo build` that quietly produced nothing would otherwise let
          # the binary-dependent tests skip and CI go green without them.
          TANOD_REQUIRE_BINARY: "1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test on Bun
        run: npm run test:bun
        env:
          TANOD_REQUIRE_BINARY: "1"

  # The end-to-end evidence behind the README's claims. Every script asserts its
  # own result and exits non-zero when it fails, so this is a gate rather than a
  # report — and each one writes the parameters it ran with next to its numbers,
  # published as an artifact so a result can be compared against another machine
  # instead of being read as a universal baseline.
  benchmarks:
    name: end-to-end benchmarks (linux)
    runs-on: ubuntu-latest
    # Longer than the unit-test job: bench/tls.sh compiles a second binary with
    # the TLS stack, and adversarial.sh, soak.sh, upgrade.sh and chaos.sh each
    # run for a fixed wall-clock span.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Record the machine the numbers came from
        run: |
          {
            echo "runner: ${{ runner.os }} ${{ runner.arch }}"
            echo "cpus: $(nproc)"
            echo "memory: $(free -h | awk '/^Mem:/ {print $2}')"
            echo "kernel: $(uname -r)"
            echo "rustc: $(rustc --version)"
            echo "commit: $(git rev-parse HEAD)"
          } | tee benchmark-environment.txt

      # A GitHub runner has two cores, so the concurrency is kept low enough
      # that requests genuinely overlap rather than queueing behind the load
      # generator itself. The Next.js proof runs in its own job.
      - name: Run the benchmark suite
        env:
          BENCH_REPORT_DIR: ${{ github.workspace }}/benchmark-results
          SKIP_DOCKER: "1"
          DEMO_CONCURRENCY: "30"
          COALESCE_CONCURRENCY: "30"
          STREAM_CONCURRENCY: "16"
          SAFETY_CONCURRENCY: "20"
          # The spool benchmark asserts on its own control case, so its
          # parameters have to keep a two-core runner slow enough to reproduce
          # the problem being fixed. It fails loudly rather than passing
          # vacuously if they do not.
          SPOOL_MIB: "8"
          SPOOL_RATE: "24k"
          ADVERSARIAL_SECONDS: "20"
          # Phase-2 operability scripts, at CI size. These are smoke-sized on
          # purpose: they prove the mechanisms and the assertions still work.
          # The numbers that actually gate a release are far larger and run
          # before a tag — see docs/RELEASE-GATES.md. A one-minute soak cannot
          # find a leak of a few kilobytes per thousand requests, and this
          # workflow does not claim it can.
          UPGRADE_SECONDS: "6"
          SOAK_SECONDS: "45"
          SOAK_WORKERS: "8"
          MEMORY_ROUNDS: "6"
          MEMORY_SLOW_READERS: "12"
          CHAOS_ROUNDS: "2"
        run: ./bench/all.sh

      - name: Publish results with the parameters that produced them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            benchmark-environment.txt
          if-no-files-found: warn

  # The real-framework proof. Kept separate because it builds three Next.js
  # images and a Tanod image, and because a failure here means something
  # different from a unit test failure: the policy is wrong about Next.js, not
  # wrong about itself.
  nextjs:
    name: next.js integration proof (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the doctor validation binary
        run: cargo build --locked

      - name: HTTP assertions
        run: ./bench/nextjs.sh

      - name: Browser-driven assertions
        run: ./bench/nextjs-browser.sh

      - name: Production-reference assertions
        run: ./bench/nextjs-reference.sh

      - name: Replicated-governor assertions
        run: ./bench/nextjs-replicas.sh

  # Fuzz targets are built on every run so a target cannot rot unnoticed, and
  # run briefly. A short run is a smoke test, not a campaign: it catches a
  # target that panics immediately, which is the failure mode that matters for
  # keeping them alive in CI.
  fuzz:
    name: fuzz targets (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config

      # `rust-toolchain.toml` pins the repo to a stable release, and that file
      # wins over whatever rustup's default is — so every cargo call below is
      # explicitly `+nightly`. cargo-fuzz needs it for `-Zsanitizer=address`.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every target
        run: cargo +nightly fuzz build

      - name: Run each target briefly
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "=== $target ==="
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -print_final_stats=1
          done

      - name: Publish any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
