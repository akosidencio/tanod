name: Feature request
description: Propose a change or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where Tanod falls short. Describe the workload and deployment if they matter.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What Tanod should do instead, including any configuration you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other tools that solve this.
  - type: input
    id: version
    attributes:
      label: Tanod version
      placeholder: "0.4.1"
