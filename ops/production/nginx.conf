# Place inside an HTTPS virtual host whose certificate and server_name you own.
# Reject unknown hosts in a separate default_server. This listener is Tanod's
# only trusted peer; applications must not expose Tanod's loopback port publicly.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Rewrite-URL "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 40s;
}
