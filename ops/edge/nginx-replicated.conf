events {}

http {
  limit_req_zone $binary_remote_addr zone=clients:10m rate=50r/s;

  upstream tanod_replicas {
    hash $uri consistent;
    server tanod-1:8080 max_fails=1 fail_timeout=2s;
    server tanod-2:8080 max_fails=1 fail_timeout=2s;
    keepalive 64;
  }

  server {
    listen 8080;
    server_tokens off;

    location / {
      limit_req zone=clients burst=100 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_pass http://tanod_replicas;
    }
  }
}
