groups:
  - name: tanod-reference
    interval: 30s
    rules:
      - record: tanod:admission_saturation:ratio
        expr: >-
          sum by (job, instance, limiter) (tanod_origin_in_flight)
          / clamp_min(sum by (job, instance, limiter) (tanod_concurrency_limit), 1)

      - record: tanod:group_admission_saturation:ratio
        expr: >-
          sum by (job, limiter) (tanod_origin_in_flight)
          / clamp_min(sum by (job, limiter) (tanod_concurrency_limit), 1)

      - record: tanod:shed_rate:ratio5m
        expr: >-
          sum by (job, instance, route) (rate(tanod_admission_total{decision=~"shed_.*"}[5m]))
          / clamp_min(sum by (job, instance, route) (rate(tanod_admission_total[5m])), 0.001)

      - record: tanod:origin_latency:p95_5m
        expr: >-
          histogram_quantile(0.95,
          sum by (job, instance, route, le) (rate(tanod_origin_latency_seconds_bucket[5m])))

      # Total time as the visitor sees it, and the part of it spent queued.
      - record: tanod:request_duration:p95_5m
        expr: >-
          histogram_quantile(0.95,
          sum by (job, instance, route, le) (rate(tanod_request_duration_seconds_bucket[5m])))

      - record: tanod:queue_wait:p95_5m
        expr: >-
          histogram_quantile(0.95,
          sum by (job, instance, route, le) (rate(tanod_queue_wait_seconds_bucket[5m])))

      # Share of visitor responses that were a 5xx, whoever produced it.
      - record: tanod:visitor_5xx:ratio5m
        expr: >-
          sum by (job, instance) (rate(tanod_responses_total{code="5xx"}[5m]))
          / clamp_min(sum by (job, instance) (rate(tanod_responses_total[5m])), 0.001)

      # Background revalidations count in neither side, so this stays within 0–1.
      - record: tanod:origin_work_avoided:ratio5m
        expr: >-
          sum by (job, instance) (rate(tanod_cache_total{status=~"hit|stale"}[5m]))
          / clamp_min(sum by (job, instance) (rate(tanod_reuse_eligible_requests_total[5m])), 0.001)

      - record: tanod:cache_occupancy:ratio
        expr: >-
          sum by (job, instance) (tanod_cache_bytes)
          / clamp_min(sum by (job, instance) (tanod_cache_max_bytes), 1)

      - record: tanod:spool_occupancy:ratio
        expr: >-
          sum by (job, instance) (tanod_spool_bytes)
          / clamp_min(sum by (job, instance) (tanod_spool_max_bytes), 1)
