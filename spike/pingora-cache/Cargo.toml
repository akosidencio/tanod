[package]
name = "spike-pingora-cache"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway. Answers one question: can Tanod sit on pingora-cache's Storage
# trait and cache lock instead of building its own store and coalescer?

[dependencies]
pingora-cache = "0.8"
pingora-core = "0.8"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
async-trait = "0.1"
bytes = "1"
parking_lot = "0.12"
pingora-http = "0.8"
pingora-error = "0.8"
