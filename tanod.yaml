# Example configuration. `tanod check --config tanod.yaml` validates it.
version: 1

server:
  listen: "0.0.0.0:8080"
  # Cleartext HTTP/2. Pingora peeks for the connection preface, so this
  # listener still serves HTTP/1.1 clients.
  h2c: false
  # Native TLS termination. Needs a binary built with `--features tls`; one
  # built without it *rejects* this block rather than leaving the port dead.
  # tls:
  #   listen: "0.0.0.0:8443"
  #   cert: "/etc/tanod/fullchain.pem"
  #   key: "/etc/tanod/privkey.pem"
  #   h2: true
  #
  # Who may tell Tanod about the client. Empty by default, which means no
  # forwarded header is read from anyone: the connection peer is the client and
  # the listener decides the scheme. That default is deliberate — the scheme is
  # part of the cache key, so a client that could set it would own a key
  # dimension and mint one origin render per invented value.
  trusted_proxies:
    from: []
    # client_ip: x_forwarded   # x_forwarded | forwarded | none
    # scheme: x_forwarded

  # Process lifecycle: what a zero-downtime restart coordinates on.
  #
  # Set pid_file and upgrade_socket per instance. pid_file is written only in
  # --daemon mode; foreground supervisors and containers should signal the PID
  # they already track. Two Tanods on one host with the /tmp defaults will
  # hand each other their listening sockets.
  #
  # The two windows do different jobs. drain_period is for the *load
  # balancer*: readiness starts failing immediately and Tanod keeps serving
  # normally for this long, so the balancer has time to withdraw the instance
  # before anything stops. shutdown_timeout is what in-flight requests get
  # once the shutdown proper begins.
  #
  # shutdown_timeout is a FLOOR, not a ceiling — Pingora deliberately keeps the
  # runtime shutdown window open, so a SIGTERM costs about drain_period +
  # shutdown_timeout even on an idle process. Your
  # supervisor's stop timeout must exceed that sum, or it SIGKILLs Tanod
  # mid-drain. These defaults total 15s, inside Kubernetes' default 30s.
  graceful:
    pid_file: "/run/tanod/tanod.pid"
    upgrade_socket: "/run/tanod/upgrade.sock"
    drain_period: 5s
    shutdown_timeout: 10s

origin:
  upstreams:
    - "next-1:3000"
    - "next-2:3000"
  # round_robin (default), hash_by_path, or least_loaded.
  #
  # Hashing by path also warms the origin's own render cache and JIT state.
  # least_loaded scores each backend on outstanding work against observed
  # latency, which is what notices a backend that is up but slow.
  load_balancing: hash_by_path
  # http1 (default), http2 (prior-knowledge h2c), or auto (ALPN, needs tls).
  http_version: http1
  # tls:
  #   sni: "origin.internal"    # required; no SNI means no hostname check
  #   verify_cert: true
  #   verify_hostname: true
  concurrency:
    max: 500
    queue:
      max: 1000
      timeout: 2s
  # Reserved capacity, stated as what each priority may occupy rather than
  # what it is promised. Leaving `low` at 50 keeps half the origin ceiling
  # away from low-priority routes however many of them arrive. Every tier
  # defaults to 100, which is the same as having no tiers at all.
  priorities:
    high: 100
    normal: 90
    low: 50
  # Eject a backend that is failing real traffic, which is the failure an
  # active probe on a static path cannot see. Off by default, and pointless
  # with a single backend — there is nowhere to eject to.
  breaker:
    enabled: true
    window: 10s
    min_requests: 20
    failure_percent: 50
    open_for: 30s
    # The cap that stops a breaker causing the outage it exists to contain:
    # past it, every backend is failing and "failing" stops being a reason to
    # prefer one over another.
    max_ejected_percent: 50
  # Retry a failed request, without amplifying an outage. Safe methods only,
  # and only before the origin has answered; the budget caps retries as a
  # share of the traffic actually flowing.
  retry:
    enabled: true
    max_attempts: 2
    window: 10s
    budget_percent: 10
    budget_min: 3

health:
  path: "/healthz"
  interval: 5s
  timeout: 1s

cache:
  enabled: true
  store: memory
  max_memory: 512MiB
  max_body_size: 4MiB
  respect_origin: true
  # clock (default) or fifo. Second-chance FIFO spares an entry that has been
  # read since it was queued, which on the skewed request distribution an SSR
  # microcache actually sees is worth about a seventh more hits for one
  # relaxed atomic per read.
  eviction: clock
  # Response header the origin declares invalidation tags on. Point it at
  # `x-next-cache-tags` to consume Next.js's own tags — see docs/OPERATIONS.md
  # for what that costs.
  tag_header: "x-tanod-cache-tags"
  purge:
    # Enables POST /purge on the admin listener. Without a token the endpoint
    # does not exist: purging makes an origin re-render on demand, so an open
    # one is a stampede anybody can trigger. At least 24 printable ASCII
    # characters.
    # Read from the environment at load, so the secret is never in this file.
    # An unset variable is a startup error; ${NAME:-default} makes one optional.
    token: "${TANOD_PURGE_TOKEN:-replace-me-with-a-real-secret-32ch}"

coalesce:
  enabled: true
  # wait_timeout is omitted on purpose: it then tracks timeouts.origin, so a
  # waiter never gives up before the render it is waiting on can finish.
  on_timeout: stale_or_shed

timeouts:
  connect: 500ms
  first_byte: 5s
  idle: 30s
  origin: 30s
  downstream_write: 30s

# What a shed request gets. A browser loading a page also gets a small "busy"
# page that reloads itself; flights, API calls and HEAD keep the bare status.
overload:
  status: 503
  retry_after: 1s
  page:
    enabled: true
    title: "Hang tight, you're almost in"
    message: "We're letting visitors in a few at a time to keep the site fast. This page will refresh by itself in {{refresh}} seconds."
    refresh: 5s
    # file: /etc/tanod/busy.html   # your own HTML; same {{placeholders}}

# A bounded buffer between the origin and a slow client.
#
# Without it, an origin permit is held until the *client* finishes reading,
# because Pingora paces upstream reads against downstream writes. With it, the
# origin is never made to wait on the client, so the permit goes back when the
# origin has actually finished rendering.
#
# The cost is progressive rendering: a spooled response reaches the client only
# once the origin has finished producing it. Hence off by default and per route.
spool:
  enabled: false
  max_body: 2MiB       # ceiling on one response
  max_memory: 256MiB   # ceiling across every in-flight spool at once

# WebSocket and other protocol upgrades. Refused with 501 while this is off.
#
# An upgraded connection is held for minutes and a render for milliseconds, so
# they never share a budget: an upgrade takes a slot here and never a render
# permit. Nothing upgraded is ever cached or coalesced.
upgrade:
  enabled: false
  max_concurrent: 100

deployment:
  id: "build-local"

routes:
  - id: next-static
    match: "/_next/static/**"
    class: static

  - id: product-pages
    match: "/products/**"
    class: public_ssr
    cache:
      # A dynamically rendered Next route answers `no-store`. Without this
      # override the microcache never engages on the pages worth protecting.
      override_origin: true
      ttl:
        max: 2s
      stale_while_revalidate: 30s
      stale_if_error: 5m
    coalesce:
      enabled: true
    # Product pages are large and fully rendered before they are sent, so
    # buffering them costs nothing that streaming was providing.
    spool:
      enabled: true
    concurrency:
      max: 100
      queue:
        max: 300
        timeout: 1500ms

  - id: search
    match: "/search"
    class: public_dynamic
    cache:
      ttl:
        max: 500ms
      query:
        # An allowlist is what stops `?cachebust=<random>` from minting a
        # fresh key, and therefore a fresh render, on every request.
        mode: include
        keys: ["q", "page"]
    concurrency:
      max: 50
      queue:
        max: 100
        timeout: 1s

  - id: account
    match: "/account/**"
    class: private_dynamic
    cache:
      enabled: false
    coalesce:
      enabled: false
    concurrency:
      max: 40
      queue:
        max: 100
        timeout: 1s

telemetry:
  prometheus:
    listen: "127.0.0.1:9090"

  # Or push the same metrics to an OTLP endpoint, with no collector beside
  # Tanod. https:// needs a binary built with the `tls` feature.
  # metrics:
  #   otlp:
  #     endpoint: "https://otlp-gateway-prod-ap-southeast-1.grafana.net/otlp/v1/metrics"
  #     headers:
  #       Authorization: "Basic ${GRAFANA_OTLP_CREDENTIALS}"
  #     interval: 60s
  #     labels:
  #       environment: "${DEPLOY_ENV:-unset}"

  # Readiness, liveness and status, on a listener of their own.
  #
  # An address rather than a path, for two reasons: /status is a perfectly
  # ordinary application route so a path would collide silently with the
  # origin's URL space, and it publishes backend health, cache occupancy and
  # the config generation to anyone who can reach the site. Bind it to
  # loopback or a private address.
  #
  #   GET /health/live    200 while the process is running
  #   GET /health/ready   503 while draining — this is what a load balancer polls
  #   GET /status         generation, backend state, cache and spool usage
  #
  # Without this block there is no readiness endpoint, so nothing can tell
  # when an instance is draining and a rolling restart drops requests.
  admin:
    listen: "127.0.0.1:9091"
    # Report not-ready when no upstream is healthy. Off by default, and the
    # default is the careful one: Tanod still serves a fully unhealthy pool,
    # so turning this on without something above Tanod that can route around
    # this instance converts a degraded origin into a total edge outage.
    # Requires the health block above. Readiness stays 503 until a backend
    # completes its healthy_after success streak; unprobed is not silently
    # treated as healthy.
    require_healthy_upstream: false

  # OpenTelemetry.
  #
  # Correlation is unconditional and free: every request gets a trace id and a
  # span id, both appear on every access log line, and the id Tanod
  # concluded is forwarded to the origin as `traceparent`. This block only
  # decides whether spans are also *exported*.
  tracing:
    service_name: tanod
    sample:
      # parent_or_ratio follows an inbound sampling decision when there is one
      # and falls back to the ratio otherwise — so a trace sampled at the edge
      # does not have a hole exactly where the origin governor sits.
      mode: parent_or_ratio    # parent_or_ratio | ratio | always | never
      one_in: 20
    # Whose traceparent to believe. `never` is the safe default: a trusted load
    # balancer may merely forward a client-supplied header. Use
    # from_trusted_proxies only when every trusted proxy strips or replaces
    # traceparent and tracestate at the edge.
    trust_incoming: never   # never | from_trusted_proxies | always
    # Span export. OTLP over HTTP with the JSON encoding, plaintext only —
    # an https:// endpoint is refused at startup rather than quietly
    # downgraded. Run a collector as a sidecar and let it handle transport.
    # otlp:
    #   endpoint: "http://127.0.0.1:4318/v1/traces"
    #   timeout: 5s
    #   interval: 2s
    #   max_queue: 2048   # full means DROP; a telemetry queue must not grow
    #   max_batch: 256

  logging:
    format: json
