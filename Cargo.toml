[workspace]
members = [".", "spike/pingora-cache", "bench/slow-origin"]

[package]
name = "tanod"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Origin workload governor for server-rendered applications"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
globset = "0.4"
http = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "signal"] }
pingora-core = "0.8"
pingora-proxy = "0.8"
pingora-http = "0.8"
pingora-error = "0.8"
pingora-cache = "0.8"
parking_lot = "0.12"
prometheus = "0.13"
percent-encoding = "2"
env_logger = "0.11"
arc-swap = "1"
async-trait = "0.1"
bytes = "1"
log = "0.4"
# Trace and span ids. Chosen over `rand` because it is the OS entropy syscall
# and nothing else — no PRNG, no distributions, no generic machinery — and
# because it is already in this tree transitively, so making it direct costs
# no new code at all.
getrandom = "0.3"

[features]
# Exposes the internal parsers the fuzz targets drive. Not part of the public
# API: enabling it outside `fuzz/` has no purpose.
fuzzing = []

# Native TLS termination and origin TLS.
#
# rustls rather than boringssl or openssl: it is pure Rust, so the build needs
# no cmake, no Go and no system OpenSSL headers, which matters for a proxy
# people are expected to build themselves. Off by default because most
# deployments terminate TLS at a load balancer, and an unused TLS stack is
# unused attack surface. A config with `server.tls` or `origin.tls` is
# *rejected* by a binary built without it rather than quietly serving
# cleartext.
tls = ["pingora-core/rustls"]

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
proptest = "1"

# The crate contains no `unsafe`. `forbid` turns that from a fact about today
# into an invariant: adding a block is a compile error, not a review comment.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

# A panic in a proxy is a process-wide outage: every request in flight on that
# worker dies with it. Production code has to say what it does when the
# assumption fails, so both panicking accessors are hard errors. Tests are
# exempt via `clippy.toml` — a panicking assertion there is the point.
#
# `expect` is denied alongside `unwrap` rather than left as the sanctioned
# escape hatch: a message explains a panic, it does not justify one. The two
# places that genuinely cannot do anything else carry a scoped
# `#[expect(clippy::expect_used, reason = ...)]` naming the reason.
#
# A silent truncation is the same class of bug one layer down: it is how a
# configured duration or byte budget becomes a different one on a target with
# narrower pointers. Every remaining `as` is clamped at the call site or
# carries a scoped allow naming why it cannot lose data.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
