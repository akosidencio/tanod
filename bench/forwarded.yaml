# Trusted proxies: who is allowed to tell Tanod about the client.
#
# The `from:` list is substituted per run: empty for the untrusted case, one
# loopback block for the trusted one. Everything else is held constant, so the
# only variable between the two halves of the benchmark is whether the peer is
# believed.
version: 1
server:
  listen: "127.0.0.1:@LISTEN@"
  trusted_proxies:
    from: @TRUST@
    client_ip: @CLIENT_IP_SOURCE@
    scheme: @SCHEME_SOURCE@
origin:
  upstreams: ["127.0.0.1:@ORIGIN@"]
  concurrency:
    max: 20
cache:
  enabled: true
debug_headers: true
routes:
  # Not cacheable: this is where the origin reports what it received.
  - id: echo
    match: "/echo-headers/**"
    class: private_dynamic
    cache:
      enabled: false

  # Cacheable, so the scheme's effect on the cache key is observable as a
  # render count rather than inferred.
  - id: pages
    match: "/p/**"
    class: public_ssr
    cache:
      override_origin: true
      ttl:
        max: 10s
