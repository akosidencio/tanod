# The overload showcase stack. bench/showcase/run.sh drives it; read
# docs/demo/README.md before changing anything here.
#
# Both arms use this one file. The origins, their image, resources and
# environment are identical in both; the only difference is the NGINX upstream
# (rendered by showcase.py from one template) and whether `tanod` is started.
# The arms run one after the other, never together, so they do not share CPU.
name: tanod-showcase

x-next-build: &next-build
  context: ../../fixtures/next-storefront
  args:
    NODE_VERSION: ${TANOD_NEXT_NODE:-22}
    NEXT_VERSION: ${TANOD_NEXT_VERSION:-16.4.3}
    TANOD_BUILD_ID: next-fixture-v1
    NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

x-next-origin: &next-origin
  image: ${SHOWCASE_NEXT_IMAGE:-tanod-next-origin:showcase}
  build: *next-build
  cpus: ${SHOWCASE_ORIGIN_CPUS:-1.0}
  mem_limit: ${SHOWCASE_ORIGIN_MEMORY:-768m}
  expose:
    - "3000"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
    interval: 2s
    timeout: 1s
    retries: 30
  environment: &next-environment
    TANOD_BUILD_ID: next-fixture-v1
    # The origin's own render counter, read by the sampler. Opt-in in the
    # fixture; nothing else in the repository enables it.
    TANOD_FIXTURE_STATS: "1"
    TANOD_FIXTURE_CPU_ROUTE: "1"
    # Mechanism workload (/products/*): a sleep. It costs no CPU.
    RENDER_DELAY_MS: ${SHOWCASE_RENDER_DELAY_MS:-350}
    # Constrained workload (/catalog/*): a fixed amount of CPU work.
    CATALOG_WORK_UNITS: ${SHOWCASE_CATALOG_UNITS:-40000}

services:
  next-1:
    <<: *next-origin
    environment:
      <<: *next-environment
      INSTANCE_ID: next-1
    ports:
      - "127.0.0.1:${SHOWCASE_ORIGIN_PORT_1:-13401}:3000"

  next-2:
    <<: *next-origin
    environment:
      <<: *next-environment
      INSTANCE_ID: next-2
    ports:
      - "127.0.0.1:${SHOWCASE_ORIGIN_PORT_2:-13402}:3000"

  next-3:
    <<: *next-origin
    environment:
      <<: *next-environment
      INSTANCE_ID: next-3
    ports:
      - "127.0.0.1:${SHOWCASE_ORIGIN_PORT_3:-13403}:3000"

  # Only in the Tanod arm. run.sh starts services in dependency order itself,
  # so the edge carries no depends_on that would differ between arms.
  tanod:
    profiles: [tanod]
    image: ${SHOWCASE_TANOD_IMAGE:-tanod:showcase}
    build:
      context: ../..
    cpus: ${SHOWCASE_TANOD_CPUS:-1.0}
    mem_limit: ${SHOWCASE_TANOD_MEMORY:-256m}
    volumes:
      - ${SHOWCASE_CONFIG_DIR:?run.sh sets SHOWCASE_CONFIG_DIR}:/etc/showcase:ro
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${SHOWCASE_TANOD_METRICS_PORT:-19490}:9090"
      - "127.0.0.1:${SHOWCASE_TANOD_ADMIN_PORT:-19491}:9091"
    stop_grace_period: 10s
    command: ["run", "--config", "/etc/showcase/tanod.yaml"]

  # The public ingress in both arms. Its configuration is rendered per arm from
  # bench/showcase/nginx.conf.tpl; only the upstream block differs.
  edge:
    image: ${SHOWCASE_NGINX_IMAGE:-nginx:1.27-alpine}
    cpus: ${SHOWCASE_EDGE_CPUS:-1.0}
    mem_limit: ${SHOWCASE_EDGE_MEMORY:-256m}
    volumes:
      - ${SHOWCASE_CONFIG_DIR:?run.sh sets SHOWCASE_CONFIG_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${SHOWCASE_PORT:-18480}:8080"

  # Optional live view (run.sh --observe). It adds CPU load on the host, so
  # runs that publish numbers should say whether it was on; metadata.json does.
  prometheus:
    profiles: [observe]
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observe/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${SHOWCASE_PROMETHEUS_PORT:-19400}:9090"

  grafana:
    profiles: [observe]
    image: grafana/grafana:11.6.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/showcase.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # The repository's own provisioning: same provider, same datasource uid.
      - ../../ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observe/dashboard.json:/var/lib/grafana/dashboards/showcase.json:ro
      # The operator dashboard too, for the Tanod-side detail during the run.
      - ../../ops/grafana/dashboard.json:/var/lib/grafana/dashboards/tanod.json:ro
    ports:
      - "127.0.0.1:${SHOWCASE_GRAFANA_PORT:-13400}:3000"
