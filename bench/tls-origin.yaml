# The outer proxy of the origin-TLS chain: plaintext downstream, TLS upstream
# to another Tanod that is terminating it.
#
# `verify_cert: false` because the chain is a self-signed certificate minted
# for this run, and because Pingora 0.8's rustls connector does not read a
# per-peer CA store — a limitation Tanod rejects at startup rather than
# papering over. `tanod check` prints a warning for exactly this setting.
version: 1
server:
  listen: "127.0.0.1:@LISTEN@"
origin:
  upstreams: ["127.0.0.1:@ORIGIN@"]
  tls:
    sni: "@SNI@"
    verify_cert: false
    verify_hostname: false
  concurrency:
    max: 20
cache:
  enabled: false
debug_headers: true
routes:
  - id: pages
    match: "/**"
    class: public_ssr
