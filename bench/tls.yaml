# TLS termination in Tanod.
#
# Both listeners run at once: `server.listen` stays cleartext and
# `server.tls.listen` terminates TLS, so one process can serve a migration and
# so this benchmark can compare the two side by side without a second config.
version: 1
server:
  listen: "127.0.0.1:@LISTEN@"
  tls:
    listen: "127.0.0.1:@TLS_LISTEN@"
    cert: "@CERT@"
    key: "@KEY@"
    h2: true
origin:
  upstreams: ["127.0.0.1:@ORIGIN@"]
  concurrency:
    max: 20
cache:
  enabled: true
debug_headers: true
routes:
  - id: echo
    match: "/echo-headers/**"
    class: private_dynamic
    cache:
      enabled: false
  - id: pages
    match: "/p/**"
    class: public_ssr
    cache:
      override_origin: true
      ttl:
        max: 10s
